# ==============================================================================
# Flutter Ultimate Linter Configuration Template
# Recommended rules enforcing 60/120 FPS performance, memory safety, and Dart 3 idioms.
# ==============================================================================
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    use_build_context_synchronously: error
    cancel_subscriptions: error
    close_sinks: error
    dead_code: error
    unused_element: error
    unused_field: error
    unused_import: error
    unused_local_variable: error

linter:
  rules:
    # --------------------------------------------------------------------------
    # 1. Performance & Frame Budget
    # --------------------------------------------------------------------------
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_literals_to_create_immutables
    - prefer_const_declarations
    - sized_box_for_whitespace
    - use_colored_box
    - use_decorated_box
    - avoid_unnecessary_containers
    - avoid_redundant_argument_values

    # --------------------------------------------------------------------------
    # 2. Memory & Resource Disposal
    # --------------------------------------------------------------------------
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - unawaited_futures

    # --------------------------------------------------------------------------
    # 3. BuildContext & Lifecycle Traps
    # --------------------------------------------------------------------------
    - use_build_context_synchronously

    # --------------------------------------------------------------------------
    # 4. Modern Dart 3 & Architecture Idioms
    # --------------------------------------------------------------------------
    - avoid_empty_else
    - avoid_relative_lib_imports
    - avoid_shadowing_type_parameters
    - avoid_types_as_parameter_names
    - await_only_futures
    - camel_case_extensions
    - camel_case_types
    - curly_braces_in_flow_control_structures
    - empty_catches
    - file_names
    - hash_and_equals
    - no_duplicate_case_values
    - non_constant_identifier_names
    - prefer_conditional_assignment
    - prefer_contains
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_for_elements_to_map_fromIterable
    - prefer_generic_function_type_aliases
    - prefer_if_null_operators
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_iterable_whereType
    - prefer_single_quotes
    - prefer_spread_collections
    - unnecessary_const
    - unnecessary_constructor_name
    - unnecessary_late
    - unnecessary_new
    - unnecessary_null_aware_assignments
    - unnecessary_nullable_for_final_variable_declarations
    - unnecessary_string_escapes
    - unnecessary_string_interpolations
    - unnecessary_this
    - use_rethrow_when_possible
