description = "Comprehensive architectural and static code audit of a Flutter repository"
prompt = "Perform a Principal-level architectural and static code audit of the whole Flutter repository (or the folder the user names). Step 1: Run the deterministic static code analyzer from repository root: on Windows run 'powershell -ExecutionPolicy Bypass -File scripts/audit-flutter.ps1' (or bash scripts/audit-flutter.sh on Linux/macOS) to detect all P01-P40 performance traps, W01-W20 memory leaks, K01-K14 BuildContext async traps, outdated linter packages, and native GDPR defaults. Step 2: Inspect configuration health: verify pubspec.yaml declares current 'flutter_lints: ^5.0.0' or 'very_good_analysis' in dev_dependencies; verify analysis_options.yaml enforces strict typing (strict-casts, strict-inference, strict-raw-types) and error-level severities for context and disposal traps; verify native privacy flags in android/app/src/main/AndroidManifest.xml and ios/Runner/Info.plist disable third-party analytics prior to user consent. Step 3: Scan architectural topology: check navigation strategy (go_router StatefulShellRoute for tabs vs manual pushes), state management tiers against the 4-Tier Ladder, secure credential storage (hardware Keystore/Keychain options), and offline storage (Hive AES encryption and LazyBox usage for large datasets). Step 4: Present an executive audit report: 1. Executive Summary (files scanned, fatal/warning finding counts, linter status, privacy compliance). 2. Findings grouped by Must fix (Critical/High), Should fix (Medium), and Nice to have (Low). For each finding: bold file:line title, then What this is, Problem, Fix, If we skip it. 3. Concrete remediation roadmap in order of ROI. End with 'Static Audit Command:' ready to re-verify fixes. Change no code."
