description = "Principal-level review of Flutter changes: 60/120 FPS budget, memory leaks, context safety, Dart 3 idioms"
prompt = "Review the current Flutter and Dart code changes like a Principal Flutter & Dart Framework Architect. Review what the user names (uncommitted or staged changes, a branch, a PR link, or files); if nothing is named, review uncommitted git changes, or the last commit if the working tree is clean. First read the code the change touches: parent widgets, callers, State lifecycle methods (initState, dispose, didUpdateWidget), and build methods. A Flutter change can cause jank or leaks in subtrees it does not directly touch. Systematically evaluate against the Flutter Ultimate standards in strict priority order: 1. CRITICAL RUNTIME SAFETY: Async BuildContext gaps (K01-K14: any Navigator, ScaffoldMessenger, Theme, MediaQuery, or context.read/watch/go/push after an await without immediate if (!context.mounted) return; or if (!mounted) return;), Disposal pairing leaks (W01-W20: controllers closed with .dispose(), stream sinks with .close(), subscriptions and timers with .cancel() in dispose()), and Isolate compute starvation (heavy jsonDecode >50KB or crypto on the main isolate blocking the 8.33ms/16.6ms frame budget). 2. 60/120 FPS PIPELINE (2ms-5ms Dart execution window): Missing const constructors (P01), whole-screen setState() at scaffold root (P02), helper _buildX() methods instead of const StatelessWidget (P03), Paint/Path/TextStyle allocations inside build() or paint() (P04), unfiltered MediaQuery.of(context) instead of selective MediaQuery.sizeOf(context) (P07), eager FutureBuilder(future: api.fetch()) without caching (P12), unvirtualized lists and nested shrinkWrap: true (P18, P19), offscreen buffer churn from animated Opacity (P26) or ClipRRect (P27), and AnimatedBuilder missing static child reuse (P09). 3. DART 3 & ARCHITECTURE: 4-Tier State Ladder discipline (ephemeral leaf setState -> targeted ValueNotifier -> scoped ChangeNotifier -> enterprise BLoC/Riverpod), UI states modeled as sealed class hierarchies with exhaustive pattern matching, zero-cost domain IDs via extension type, and production ecosystem best practices (go_router StatefulShellRoute tab preservation, flutter_bloc concurrency transformers, flutter_secure_storage hardware keystores, and Hive encrypted LazyBox memory limits). Start with 'What this change does:' in 2-3 concise sentences. Then list numbered findings grouped into Must fix (Critical/High), Should fix (Medium), and Nice to have (Low). For each finding provide: a bold title with file:line, then four bullets: What this is, Problem, Fix (minimal idiomatic snippet), If we skip it (one short sentence on production impact). End with 'Verdict:' (Ship / Request Changes), '60/120 FPS Status:', 'Disposal & Memory Status:', and 'Not checked:' for anything uninspected. Change no code."
